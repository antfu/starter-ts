ignoreWorkspaceRootCheck: true
catalogMode: prefer

minimumReleaseAgeExcludePrune: true
minimumReleaseAgeExclude:
  - knip@6.45.1
  - vite@8.3.8

trustPolicy: no-downgrade

update:
  ignoreDeps:
    - typescript@7

shellEmulator: true

packages:
  - playground
  - docs
  - packages/*
  - examples/*

allowBuilds:
  esbuild: true
  simple-git-hooks: true

catalogs:
  agentic:
    '@antfu/skills': ^0.1.3
    skills: ^1.8.1
  cli:
    '@antfu/eslint-config': ^10.0.0
    '@antfu/ni': ^30.6.0
    bumpp: ^12.3.0
    eslint: ^10.14.0
    eslint-plugin-slop: ^0.1.3
    eslint-plugin-sonarjs: ^4.2.2
    knip: ^6.45.1
    nano-staged: ^1.0.2
    publint: ^0.3.25
    simple-git-hooks: ^2.14.0
    taze: ^21.3.0
    tsdown: ^0.23.7
    tsx: ^4.23.15
    typescript: ^6.0.3
    vite: ^8.3.8
  inlined:
    '@antfu/utils': ^9.3.0
  testing:
    tsdown-stale-guard: ^0.1.3
    tsnapi: ^1.6.1
    vitest: ^5.1.0
  types:
    '@types/node': ^26.6.6
