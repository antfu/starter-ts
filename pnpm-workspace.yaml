ignoreWorkspaceRootCheck: true
catalogMode: prefer

minimumReleaseAgeExcludePrune: true
minimumReleaseAgeExclude:
  - '@antfu/skills@0.1.0'

trustPolicy: no-downgrade

update:
  ignoreDeps:
    - typescript@7

shellEmulator: true

packages:
  - playground
  - docs
  - packages/*
  - examples/*

allowBuilds:
  esbuild: true
  simple-git-hooks: true

catalogs:
  agentic:
    '@antfu/skills': ^0.1.0
    skills-npm: ^4.0.0
  cli:
    '@antfu/eslint-config': ^9.5.1
    '@antfu/ni': ^30.6.0
    bumpp: ^12.3.0
    eslint: ^10.11.0
    eslint-plugin-slop: ^0.1.3
    eslint-plugin-sonarjs: ^4.2.2
    knip: ^6.38.0
    nano-staged: ^1.0.2
    publint: ^0.3.24
    simple-git-hooks: ^2.14.0
    taze: ^21.2.0
    tsdown: ^0.23.0
    tsx: ^4.23.15
    typescript: ^6.0.3
    vite: ^8.3.1
  inlined:
    '@antfu/utils': ^9.3.0
  testing:
    tsdown-stale-guard: ^0.1.3
    tsnapi: ^1.5.0
    vitest: ^5.0.2
  types:
    '@types/node': ^26.6.3
